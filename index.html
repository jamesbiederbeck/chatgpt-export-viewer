<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <base href="/">
    <title>ChatGPT Chat History Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left column with chat list -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Chat History</h1>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search chats..." class="search-input">
                </div>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Chats will be here -->
            </div>
        </div>
        
        <!-- Right column with chat content -->
        <div class="main-content">
            <div class="chat-header" id="chatHeader">
                <h2>Select a chat to view</h2>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be here -->
            </div>
        </div>
    </div>
    <script>
        // Function to format date
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000); // Convert timestamp to milliseconds
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Function to filter chats by search query
        function filterChats(chats, query) {
            if (!query) return chats;
            const lowercaseQuery = query.toLowerCase();
            return chats.filter(chat => 
                chat.title.toLowerCase().includes(lowercaseQuery)
            );
        }

        // Function to load chat list
        async function loadChatList() {
            try {
                const response = await fetch('/list_chats');
                const chats = await response.json();
                const chatList = document.getElementById('chatList');
                
                const chatDetails = chats.map(chat => ({
                    id: chat.id,
                    title: chat.title,
                    createTime: chat.create_time,
                }));
                
                // Sort chats by creation date (newest first)
                chatDetails.sort((a, b) => b.createTime - a.createTime);
                
                // Store chats in a variable for filtering
                window.allChats = chatDetails;
                
                // Initial display of chats
                displayChats(chatDetails);
                
                // Add search input event listener
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    const filteredChats = filterChats(window.allChats, e.target.value);
                    displayChats(filteredChats);
                });
            } catch (error) {
                console.error('Error loading chat list:', error);
            }
        }

        // Function to display chats in the list
        function displayChats(chats) {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';
            
            if (chats.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = 'No chats found';
                chatList.appendChild(noResults);
                return;
            }
            
            chats.forEach(chat => {
                const chatElement = document.createElement('div');
                chatElement.className = 'chat-item';
                
                // Create container for title and date
                const titleElement = document.createElement('div');
                titleElement.className = 'chat-item-title';
                titleElement.textContent = chat.title;
                
                const dateElement = document.createElement('div');
                dateElement.className = 'chat-item-date';
                dateElement.textContent = formatDate(chat.createTime);
                
                chatElement.appendChild(titleElement);
                chatElement.appendChild(dateElement);
                chatElement.onclick = () => loadChat(chat.id);
                chatList.appendChild(chatElement);
            });
        }

        // Function to load chat content
        async function loadChat(chatFile, pushState = true) {
            if (pushState) {
                const slug = chatFile.replace('.json', '');
                history.pushState({ chatFile }, '', `/chat/${slug}`);
            }
            try {
                const response = await fetch(`/chats/${chatFile}`);
                const chatData = await response.json();
                
                // Update header and add date
                const chatHeader = document.getElementById('chatHeader');
                chatHeader.innerHTML = `
                    <h2>${chatData.title || chatFile.replace('.json', '')}</h2>
                    <div class="chat-header-meta">
                        <div class="chat-date">Created: ${formatDate(chatData.create_time)}</div>
                        <div class="chat-filepath"><code>chats/${chatFile}</code></div>
                    </div>
                `;
                
                // Display messages
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                
                // Create ordered list of messages
                const messages = [];
                const mapping = chatData.mapping;
                
                // Find first message (with parent: null)
                let currentId = Object.values(mapping).find(msg => msg.parent === null)?.children[0];
                
                const convId = chatFile.replace('.json', '');

                // Collect all messages in correct order
                while (currentId) {
                    const currentMessage = mapping[currentId];
                    const parts = currentMessage.message?.content?.parts;
                    if (parts?.length) {
                        messages.push({
                            role: currentMessage.message.author.role,
                            parts,
                        });
                    }
                    currentId = currentMessage.children[0];
                }

                function renderPart(part, convId) {
                    if (typeof part === 'string') {
                        if (!part.trim()) return null;
                        const el = document.createElement('span');
                        el.className = 'part-text';
                        el.textContent = part;
                        return el;
                    }
                    const ct = part.content_type;
                    if (ct === 'image_asset_pointer') {
                        const fileId = part.asset_pointer.replace(/^[^:]+:\/\//, '');
                        const img = document.createElement('img');
                        img.src = `/asset/${convId}/${fileId}`;
                        img.className = 'chat-image';
                        img.loading = 'lazy';
                        return img;
                    }
                    if (ct === 'real_time_user_audio_video_asset_pointer') {
                        const ptr = part.audio_asset_pointer?.asset_pointer;
                        if (!ptr) return null;
                        const fileId = ptr.replace(/^[^:]+:\/\//, '');
                        const audio = document.createElement('audio');
                        audio.controls = true;
                        audio.src = `/asset/${convId}/${fileId}`;
                        audio.className = 'chat-audio';
                        return audio;
                    }
                    if (ct === 'audio_transcription') {
                        if (!part.text?.trim()) return null;
                        const el = document.createElement('span');
                        el.className = 'part-transcription';
                        el.textContent = part.text;
                        return el;
                    }
                    // Fallback for unknown types
                    const text = JSON.stringify(part);
                    if (!text || text === '{}') return null;
                    const el = document.createElement('span');
                    el.className = 'part-text';
                    el.textContent = text;
                    return el;
                }

                // Display messages
                messages.forEach(message => {
                    const rendered = message.parts
                        .map(p => renderPart(p, convId))
                        .filter(Boolean);
                    if (!rendered.length) return;
                    const messageElement = document.createElement('div');
                    messageElement.className = `message ${message.role}`;
                    rendered.forEach(el => messageElement.appendChild(el));
                    chatMessages.appendChild(messageElement);
                });
            } catch (error) {
                console.error('Error loading chat:', error);
            }
        }

        // Handle browser back/forward
        window.addEventListener('popstate', (e) => {
            if (e.state?.chatFile) {
                loadChat(e.state.chatFile, false);
            }
        });

        // Load chat list when page loads, then open chat from URL if present
        document.addEventListener('DOMContentLoaded', async () => {
            await loadChatList();
            const match = window.location.pathname.match(/^\/chat\/([^/]+)$/);
            if (match) {
                const chatFile = match[1].endsWith('.json') ? match[1] : match[1] + '.json';
                loadChat(chatFile, false);
            }
        });
    </script>
</body>
</html>
